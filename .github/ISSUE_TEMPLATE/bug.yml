name: Erro na REAL-26
description: Relate um problema nos testes da carteira, do nó ou da mineração.
body:
  - type: markdown
    attributes:
      value: |
        Para vulnerabilidades, use o [canal privado da REAL-26](https://github.com/real-26-project/real26/security/advisories/new).
        Revise os anexos e remova senhas, chaves, backups e cookies RPC.
  - type: input
    id: ambiente
    attributes:
      label: Versão e sistema operacional
      placeholder: testnet-v0.2.0, Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: perfil
    attributes:
      label: Perfil
      options:
        - Teste compartilhado
        - Teste isolado
        - Outro
    validations:
      required: true
  - type: textarea
    id: comportamento
    attributes:
      label: O que aconteceu e como reproduzir
      description: Informe o resultado esperado e o resultado observado.
    validations:
      required: true
  - type: textarea
    id: dados
    attributes:
      label: Dados adicionais
      description: Inclua altura da rede, quantidade de pares, mensagens de erro ou trechos de log revisados.
