name: Sugestão para a REAL-26
description: Proponha uma melhoria para a carteira, o nó ou a documentação.
body:
  - type: textarea
    id: problema
    attributes:
      label: O que você quer resolver?
      description: Descreva a dificuldade e em qual parte da REAL-26 ela aparece.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Qual mudança você sugere?
    validations:
      required: true
